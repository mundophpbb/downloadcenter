<div class="downloadcenter-bbcode-toolbar" data-downloadcenter-bbcode-toolbar>
    <div class="downloadcenter-bbcode-group" aria-label="{L_DOWNLOADCENTER_BBCODE_FORMATTING}">
        <button type="button" class="downloadcenter-bbcode-btn" data-bbcode="b" title="Negrito"><strong>B</strong></button>
        <button type="button" class="downloadcenter-bbcode-btn" data-bbcode="i" title="Itálico"><em>I</em></button>
        <button type="button" class="downloadcenter-bbcode-btn" data-bbcode="u" title="Sublinhado"><span class="downloadcenter-bbcode-underline">U</span></button>
        <button type="button" class="downloadcenter-bbcode-btn" data-bbcode="s" title="Riscado"><span class="downloadcenter-bbcode-strike">S</span></button>
    </div>
    <div class="downloadcenter-bbcode-group" aria-label="{L_DOWNLOADCENTER_BBCODE_INSERT}">
        <button type="button" class="downloadcenter-bbcode-btn downloadcenter-bbcode-wide" data-bbcode="url">URL</button>
        <button type="button" class="downloadcenter-bbcode-btn downloadcenter-bbcode-wide" data-bbcode="quote">Quote</button>
        <button type="button" class="downloadcenter-bbcode-btn downloadcenter-bbcode-wide" data-bbcode="code">Code</button>
        <button type="button" class="downloadcenter-bbcode-btn downloadcenter-bbcode-wide" data-bbcode="list">List</button>
    </div>
    <label class="downloadcenter-bbcode-size-label">
        <span>{L_DOWNLOADCENTER_BBCODE_FONT_SIZE}{L_COLON}</span>
        <select data-bbcode-size>
            <option value="">{L_DOWNLOADCENTER_BBCODE_FONT_SIZE_SELECT}</option>
            <option value="85">85%</option>
            <option value="100">100%</option>
            <option value="120">120%</option>
            <option value="150">150%</option>
            <option value="200">200%</option>
        </select>
    </label>
</div>
<p class="downloadcenter-bbcode-help">{L_DOWNLOADCENTER_BBCODE_HELP}</p>
